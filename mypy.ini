[mypy]
# Strict static typing, pinned here so `mypy` means the same thing for everyone (tools/lint.sh
# runs `mypy src` and, separately, `mypy --explicit-package-bases recipes`; both pick this up).
#
# `strict` bundles: disallow_untyped_defs, disallow_incomplete_defs, disallow_untyped_calls,
# disallow_untyped_decorators, disallow_any_generics, disallow_subclassing_any,
# check_untyped_defs, no_implicit_reexport, warn_redundant_casts, warn_unused_ignores,
# warn_return_any, strict_equality, extra_checks, warn_unused_configs. Every parameter and
# return needs a real type; every generic (`dict`, `list`, `Callable`, `CaptureFixture`, ...)
# needs its type arguments; a function can never silently return `Any` from a typed signature.
strict = True

# A recipe's data/ holds whatever its fetch.sh downloaded -- git-ignored, not ours, and some real
# datasets ship Python 2 helper scripts (Spider does), which a type-check of the *repository*
# should never see. Without this, running a fetch script makes `tools/lint.sh` fail on a syntax
# error in someone else's file. Same reason ruff excludes it.
exclude = (?x)(^|/)recipes/[^/]+/data/
