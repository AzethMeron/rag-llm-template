# A llama-server router-mode preset for the shared local reranker model (bge-reranker-v2-m3),
# used by a recipe's `[endpoint.rerank]` via `server_args = ["--models-preset",
# "tools/rerank_presets.ini"]` in its models.toml.
#
# Router mode auto-discovers a preset per GGUF file under --models-dir, named from the filename --
# but an auto-discovered preset does not enable the reranking endpoint, so a bare `--models-dir`
# alone leaves `/v1/rerank` unavailable. This preset both names the model "rerank" (matching
# `[model.rerank] model_id = "rerank"`) and turns on `--reranking`, so `--models-dir` alone is
# never sufficient for this endpoint -- this file is required, not optional polish (same shape as
# tools/embed_presets.ini, see its comment for the fuller rationale).
[rerank]
model = models/bge-reranker-v2-m3-Q8_0.gguf
reranking = true
jinja = 1
