# A llama-server router-mode preset for the shared local embedding model (Qwen3-Embedding-0.6B),
# used by the recipes that define an `[endpoint.embed]` -- currently `med_evidence` and
# `legal_procurement`, the two with dense retrieval available -- via
# `server_args = ["--models-preset", "tools/embed_presets.ini"]` in their models.toml. The other
# four recipes are lexical-only and never load this.
#
# Router mode auto-discovers a preset per GGUF file under --models-dir, named from the filename --
# but an auto-discovered preset does not enable embeddings mode, so a bare `--models-dir` alone
# returns "This server does not support embeddings. Start it with --embeddings" for any request.
# This preset both names the model "embed" (matching every recipe's `models.toml`
# `[model.embedder] model_id = "embed"`) and turns on `--embeddings`, so `--models-dir` alone is
# never sufficient for this endpoint -- this file is required, not optional polish.
[embed]
model = models/Qwen3-Embedding-0.6B-Q8_0.gguf
embeddings = true
jinja = 1
