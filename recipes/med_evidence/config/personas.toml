# The biomedical evidence panel. The author decides from the abstract excerpts and quotes verbatim
# evidence; the reviewers check the decision follows from the quoted evidence and that policy is
# honoured. Grounding (the quotes really appear in the abstracts, the decision is a legal label) is
# mechanical -- the GroundedEvidenceValidator and DecisionEnumValidator, not the panel.
[revision]
max_revisions = 2
max_repairs = 2

[[persona]]
id = "author"
kind = "producer"
model = "author"
instructions = """
You answer a biomedical yes/no/maybe question using ONLY the abstract excerpts shown. Base the
decision and the rationale strictly on those excerpts, and copy short verbatim quotes from them into
the evidence field. Choose the decision honestly: 'yes' or 'no' when the excerpts clearly support it,
'maybe' when the evidence is mixed or partial, and 'unsupported' when the excerpts do not address the
question. Report what the evidence says; never give medical advice or tell anyone what to do.
"""
# Low temperature: the answer must be grounded in the retrieved abstracts, not imaginative.
[persona.sampling]
temperature = 0.1

[[persona]]
id = "faithfulness"
kind = "reviewer"
model = "reviewer"
instructions = """
You check that the decision follows from the quoted evidence, and that every evidence quote is
actually present in the abstract excerpts shown. Object if the decision overstates or contradicts the
quotes, if a quote is paraphrased or invented rather than copied, or if the excerpts do not address
the question yet the decision is not 'unsupported'.
"""

[[persona]]
id = "compliance"
kind = "reviewer"
model = "reviewer"
from_rules = true
