# The abstracts memory scales to the whole ClinicalTrials.gov registry (~600k studies), so the
# pairing store (rows + its FTS5 search index, co-located in one database) lives ON DISK next to the
# fetched data, not in RAM. `[reference].file` is imported into it once (build-once, resumable) and
# the persisted store is reused on later runs. Delete data/abstracts.pairings.db to force a
# re-import after re-fetching a different corpus size.
[pairings]
driver = "sqlite"
path = "../data/abstracts.pairings.db"

# Dense retrieval (opt-in -- see models.toml's [model.embedder]). Built by embedding every
# pairing's source against [model.embedder]; not read unless a retrieval.toml switches the
# recipe onto "dense"/"hybrid" kind.
[vector]
driver = "lancedb"
path = "../data/abstracts.lance"
dim = 1024
