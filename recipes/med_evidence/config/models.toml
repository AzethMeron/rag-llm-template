# Models for the biomedical evidence recipe. A capable author helps it read the abstracts; the
# reviewers are cheap.
[endpoint.local]
provider = "llamacpp-router"
base_url = "http://127.0.0.1:8080/v1"
resident_max = 4
parallel = 2

# Qwen3-14B (fetch with tools/fetch_models.sh --only med_author -- too large, ~10.5GB, to be part
# of the default fetch-everything set), not the smaller default every other recipe uses: this is
# the model the README's "Measured baseline" table's numbers were produced with, so the recipe's
# checked-in config reproduces that result rather than silently drifting from what's documented.
[model.author]
endpoint = "local"
model_id = "Qwen3-14B-Q5_K_M"
backend = "auto"
context_window = 8192

# Deliberately smaller than the shared "reviewer" default (Qwen3-1.7B-Q8_0), for two reasons that
# are specific to this recipe. This is fetch_models.sh's "ci" entry, already downloaded.
#   1. VRAM: the author above is a 10.5 GB 14B. Pairing it with the 1.7 GB default reviewer plus
#      both KV caches leaves very little headroom on the 16 GB card this recipe is sized for.
#   2. Reproducibility: the README's "Measured baseline" table was produced with this pairing.
# (Historically this also worked around fetch_models.sh naming a Qwen3.5 GGUF family that does not
# exist; that is fixed at the source now, so what remains is the choice above, not a stopgap.)
[model.reviewer]
endpoint = "local"
model_id = "Qwen3-0.6B-Q8_0"
backend = "auto"
context_window = 8192

# Dense retrieval (opt-in): a separate embedding endpoint, since llama.cpp serves a --embedding
# model as its own process, not through the chat router. Add a retrieval.toml with [retrieval]
# kind = "dense" (or "hybrid") and [vector] in storage.toml to actually switch the recipe onto
# it; the default remains lexical-only. (tests/test_recipe.py's TestAbstractsMemoryOnEachVectorDB
# already exercises this path over both real vector drivers.)
[endpoint.embed]
provider = "llamacpp-router"
base_url = "http://127.0.0.1:8081/v1"
resident_max = 1
parallel = 4
# Router mode auto-discovers a model per GGUF file, but not under the name "embed" below, and
# without --embeddings enabled -- see tools/embed_presets.ini's own comment for why this is
# required, not optional.
server_args = ["--models-preset", "tools/embed_presets.ini"]

[model.embedder]
endpoint = "embed"
model_id = "embed"
kind = "embedding"
context_window = 32768
