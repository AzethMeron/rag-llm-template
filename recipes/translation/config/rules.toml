# Translation policy — a faithful port of llm-translator's config/translation_rules.toml.
# [[forbidden]] patterns are model failure modes (text *about* the translation, not the translation)
# and are rejected in code; [[advisory]] criteria are prose judged by the compliance reviewer.
# The wording patterns are English-targeted (small models leak English meta-text even on non-English
# jobs); add target-language equivalents for your pair. NOTE: this file has NO {source_language}/
# {target_language} substitution -- write "the target language", not a placeholder.

[limits]
# Project-wide soft line-width guideline, warned about; a unit's hard budget (from its medium) is a
# per-record max_columns. Width is in half-width columns, so a full-width CJK glyph counts as two.
max_line_columns = 110
# How far a translation may exceed a unit's hard budget and still be kept (reading time / box space
# is not an exact cliff; a rejected unit shows the untranslated source instead).
max_columns_tolerance = 0.12
# A non-empty source must produce a non-empty translation.
require_nonempty = true
# line_width means "too long" -- imperfect but still worth showing (the alternative is the
# untranslated source); untranslated means "not done", which is not, so only line_width is kept.
keep_flagged_rules = ["line_width"]

[lexicon]
# Terminology consistency is a warning by default: inflected languages make exact-form matching
# unreliable (a term appears in several declined forms). Set to "error" only if terminology is not
# inflected and must appear verbatim.
severity = "warning"

[style]
# Short directives added to every role's system prompt (the framework appends them under "Style
# policy:"). Kept few and general; anything long or nuanced belongs in an [[advisory]] criterion.
directives = [
  "Render meaning, not words: the result reads as natural writing in the target language, never as a transposed source.",
  "Match the source's force and register exactly -- neither softened nor intensified.",
  "Preserve who does what to whom: do not swap the doer and the thing done to, and do not turn something that merely happens to a participant into an action they perform.",
  "Use the target language's own punctuation, quotation marks, digits and orthography.",
  "Add nothing that was not in the source, drop nothing that was, and keep each proper noun spelled one way throughout.",
  "Keep each output line at or under 110 display columns; insert a literal \\n where a break is needed.",
]

# --- forbidden patterns (rejected outright) -----------------------------------
[[forbidden]]
pattern = "(?i)^(here is|here's|sure[,!]|certainly[,!]|of course[,!]|as requested)"
reason = "conversational preamble; the response must be the translation alone"

[[forbidden]]
pattern = "(?i)\\b(as an ai|i cannot|i can't translate|i'm unable to|i apologize|i'm sorry, but)\\b"
reason = "model commentary or a refusal leaked into the output"

[[forbidden]]
pattern = "(?i)^(translation|translated|output|result)\\s*:"
reason = "a label prefixed to the translation"

[[forbidden]]
pattern = "\\[(note|translator|tl note|sic)[^\\]]*\\]"
reason = "translator's note; the output has no room for annotation"

[[forbidden]]
pattern = "(?i)\\((literally|lit\\.|or:|alternatively)[^)]*\\)"
reason = "an alternative rendering offered alongside the translation"

# Two placeholders left touching (other than at end of line) usually means dropped text between them.
[[forbidden]]
pattern = "\\[\\[\\s*\\d+\\s*\\]\\]\\s*\\[\\[\\s*\\d+\\s*\\]\\](?!\\s*$)"
reason = "placeholders collapsed together, which usually means text between them was dropped"

# --- advisory criteria (judged by the compliance reviewer, all in one pass) ---
[[advisory]]
id = "register"
description = """
The translation keeps the source's register and level of politeness. Casual stays casual, \
formal stays formal, rude stays rude. Where the target language marks formality that the \
source does not spell out -- the informal versus formal "you" (tu/vous, du/Sie, ты/вы), \
honorifics, humble and polite forms -- the level chosen fits the relationship and situation \
and is consistent within the exchange. Flattening a distinctive voice into neutral standard \
prose is a defect.
"""

[[advisory]]
id = "voice_consistency"
description = """
Where a speaker is named, the line sounds like that speaker and is consistent with how they \
have been written elsewhere. A character's idiom, bluntness, formality or verbal tics survive \
the translation.
"""

[[advisory]]
id = "continuity"
description = """
Where surrounding lines are shown, the translation is consistent with them: the same term for \
the same thing, continuous pronouns and tense, and a sentence split across units that reads as \
one sentence. The line follows sensibly from what precedes it and leads into what follows.
"""

[[advisory]]
id = "proper_nouns"
description = """
Names, places and brands are spelled one way throughout. In the same script as the source, the \
spelling is kept and only the ending inflected where the target language inflects. Across \
scripts, the name is transliterated into the target script and then spelled that same way every \
time it appears -- never re-transliterated differently, never partly translated. A reader must \
be able to tell it is the same referent each time.
"""

[[advisory]]
id = "pronouns_and_reference"
description = """
Every pronoun refers unambiguously to the right participant and agrees with it in gender and \
number as the target language requires. Subjects the source omits are supplied where the target \
grammar needs them, and subjects the target would naturally drop are not forced in. Gendered \
agreement follows the referent's gender, not the source word's.
"""

[[advisory]]
id = "figurative_language"
description = """
Figurative, understated or euphemistic source is rendered for what it means, not for the image \
it uses -- where the target language does not share that image. A metaphor forced across into a \
language with no such figure, so the picture survives but the point is lost, is a defect. But an \
image the two languages genuinely share is not a calque and must not be flagged as one. Object \
only when the rendering would actually puzzle a native speaker.
"""

[[advisory]]
id = "localization"
description = """
Numbers, dates, times, measurements and punctuation follow the target locale's conventions -- \
decimal and thousands separators, date order, the target's quotation marks and sentence \
punctuation -- WITHOUT changing or adding information. Converting a format is expected; \
converting a value, or inventing a unit the source did not give, is not.
"""
