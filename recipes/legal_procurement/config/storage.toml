# The reference corpus (polqa's passages) is large — millions of passages, gigabytes of text — so
# the pairing store (rows + its FTS5 search index, co-located in one database) is kept ON DISK next
# to the fetched data rather than in RAM. `[reference].file` is imported into it once (build-once,
# resumable) and the persisted store is reused on later runs. Delete data/passages.pairings.db to
# force a re-import after re-fetching a different corpus size.
[pairings]
driver = "sqlite"
path = "../data/passages.pairings.db"
