# Models for the legal-procurement recipe. A capable author reads the Polish legal passages; the
# reviewers are cheap. Both endpoints are served locally by tools/serve_models.sh.
[endpoint.local]
provider = "llamacpp-router"
base_url = "http://127.0.0.1:8080/v1"
resident_max = 4
parallel = 2

[model.author]
endpoint = "local"
model_id = "Qwen3.5-2B-Instruct-Q4_K_M"
backend = "auto"
context_window = 8192

[model.reviewer]
endpoint = "local"
model_id = "Qwen3.5-0.8B-Instruct-Q4_K_M"
backend = "auto"
context_window = 8192

# Dense retrieval (opt-in -- see README.md "To enable dense"): a separate embedding endpoint,
# since llama.cpp serves a --embedding model as its own process, not through the chat router.
# Add a retrieval.toml with [retrieval] kind = "dense" (or "hybrid") and [vector] in storage.toml
# to actually switch the recipe onto it; the default remains lexical-only.
[endpoint.embed]
provider = "llamacpp-router"
base_url = "http://127.0.0.1:8081/v1"
resident_max = 1
parallel = 4
# Router mode auto-discovers a model per GGUF file, but not under the name "embed" below, and
# without --embeddings enabled -- see tools/embed_presets.ini's own comment for why this is
# required, not optional.
server_args = ["--models-preset", "tools/embed_presets.ini"]

[model.embedder]
endpoint = "embed"
model_id = "embed"
kind = "embedding"
context_window = 32768
