[pytest]
# src for the framework; the repo root so recipe plugins (recipes.<task>.plugins...) import by
# the same dotted path a run uses (with PYTHONPATH=src:.).
pythonpath = src .
testpaths = tests recipes
# The test suite is self-contained: every model call is served by a scripted fake or an
# in-memory HTTP transport, so no inference server, GPU, or network is ever touched.
# See tests/README.md.
